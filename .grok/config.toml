# Grok-only native backstop to the write-boundary PreToolUse guard: the Stop hook verifies and commits, so the
# agent never runs ad-hoc checks or git commit. Deny wins over every allow and mode (incl. always-approve).
# Kept in sync with .github/hooks/write-boundary.json by scripts/grok-config.test.mjs.
[permission]
deny = [
	"Bash(git commit*)",
	"Bash(git -C * commit*)",
	"Bash(vitest*)",
	"Bash(npx vitest*)",
	"Bash(npx tsc*)",
	"Bash(tsc *)",
	"Bash(pnpm exec vitest*)",
	"Bash(pnpm exec biome*)",
	"Bash(pnpm exec knip*)",
	"Bash(pnpm exec tsc*)",
	"Bash(pnpm dlx biome*)",
	"Bash(pnpm dlx knip*)",
	"Bash(pnpm --filter * exec vitest*)",
	"Bash(pnpm --filter * typecheck*)",
	"Bash(pnpm --filter * test*)",
	"Bash(pnpm --filter * run typecheck*)",
	"Bash(pnpm --filter * run test*)",
	"Bash(pnpm -F * typecheck*)",
	"Bash(pnpm -F * test*)",
	"Bash(pnpm typecheck*)",
	"Bash(pnpm test*)",
	"Bash(pnpm lint*)",
	"Bash(pnpm verify*)",
	"Bash(pnpm run typecheck*)",
	"Bash(pnpm run test*)",
	"Bash(pnpm run lint*)",
	"Bash(pnpm run verify*)",
	"Bash(npm run typecheck*)",
	"Bash(npm run test*)",
	"Bash(npm run verify*)",
	"Bash(turbo run *typecheck*)",
	"Bash(turbo run *test*)",
	"Bash(pnpm exec turbo run *typecheck*)",
	"Bash(pnpm exec turbo run *test*)",
]
